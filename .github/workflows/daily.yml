name: Daily react list

on:
  schedule:
    # 13:05 UTC = 9:05 AM Eastern during daylight time (8:05 AM in winter).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      no_claude:
        description: "Use the rules ranker instead of Claude"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # only used by the keep-alive step below

concurrency:
  group: daily-react-list
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Collect, rank and publish
        env:
          FIRESTORE_SERVICE_ACCOUNT: ${{ secrets.FIRESTORE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node collector/index.js ${{ inputs.no_claude && '--no-claude' || '' }}

      # GitHub pauses scheduled workflows in public repos after 60 days without commits.
      # Re-enabling the workflow once a week keeps the daily schedule alive.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            gh workflow enable daily.yml --repo "$GITHUB_REPOSITORY" || echo "keep-alive skipped"
          fi
